name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: navalha
          POSTGRES_PASSWORD: navalha
          POSTGRES_DB: navalha_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U navalha"
          --health-interval 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Migrations up, down and up again on the empty database, then hand it to the tests.
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://navalha:navalha@localhost:5434/navalha_test
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx next typegen  # route types such as LayoutProps
      - run: npx tsc --noEmit
      - run: npm run build
