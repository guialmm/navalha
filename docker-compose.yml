# Infra for local development:
#   docker compose up -d db
# Port 5434 so it runs next to other local Postgres instances.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: navalha
      POSTGRES_PASSWORD: navalha
      POSTGRES_DB: navalha
    ports: ["5434:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navalha"]
      interval: 3s
      retries: 10

volumes:
  pg_data:
